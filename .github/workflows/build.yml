name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate plugin package
        working-directory: plugin
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='ds-mobile-skin'){throw new Error('package name must be ds-mobile-skin')}"
          test -f lib/client.js && test -f lib/index.js && test -f cordis.patch.yml

      - name: Pack plugin tarball
        working-directory: plugin
        run: npm pack --pack-destination ../dist

      - name: Validate patch applies cleanly
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patch >/dev/null
          # fetch a pristine dsh-token-viewer client.js from npm
          npm pack dsh-token-viewer --pack-destination /tmp >/dev/null 2>&1 || true
          # if the package is unavailable in CI, just verify the diff is well-formed
          if ls /tmp/dsh-token-viewer-*.tgz >/dev/null 2>&1; then
            tar -xzf /tmp/dsh-token-viewer-*.tgz -C /tmp
            ./patches/dsh-token-viewer/apply-patch.sh /tmp/package/lib/client.js
            grep -q "ds-mobile-skin: rank by cost descending" /tmp/package/lib/client.js
          else
            patch --dry-run -p1 /dev/null < patches/dsh-token-viewer/client.js.diff >/dev/null 2>&1 || \
            echo "WARN: dsh-token-viewer not published to npm; skipping apply test"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds-mobile-skin
          path: dist/
