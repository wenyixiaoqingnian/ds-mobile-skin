name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate plugin package
        working-directory: plugin
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='ds-mobile-skin'){throw new Error('package name must be ds-mobile-skin')}"
          test -f lib/client.js && test -f lib/index.js && test -f cordis.patch.yml

      - name: Pack plugin tarball
        run: |
          mkdir -p dist
          # npm pack writes the tarball to CWD; move it to the repo-root dist/ dir
          ( cd plugin && npm pack )
          mv plugin/ds-mobile-skin-*.tgz dist/
          ls -la dist/

      - name: Validate patch applies cleanly
        run: |
          # If we can fetch a pristine copy from npm, try the apply end-to-end;
          # otherwise just sanity-check the diff is well-formed.
          if command -v apt-get >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq patch >/dev/null
          fi
          set +e
          npm pack dsh-token-viewer --pack-destination /tmp >/dev/null 2>&1
          TARBALL=$(ls /tmp/dsh-token-viewer-*.tgz 2>/dev/null | head -1)
          set -e
          if [ -n "$TARBALL" ]; then
            tar -xzf "$TARBALL" -C /tmp
            bash patches/dsh-token-viewer/apply-patch.sh /tmp/package/lib/client.js
            grep -q "ds-mobile-skin: rank by cost descending" /tmp/package/lib/client.js
          else
            # dsh-token-viewer isn't on the public npm registry, so the
            # end-to-end apply can't be tested in CI. Fall back to a static
            # diff-format check: every hunk header must parse, and every '+'
            # line must be matched by a corresponding '-' line in the same
            # hunk (sanity that no +/- lines were silently lost in editing).
            echo "WARN: dsh-token-viewer not published to npm; running diff format check only"
            python3 - <<'PY'
import re, sys
text = open("patches/dsh-token-viewer/client.js.diff", encoding="utf-8").read()
hunks = re.findall(r"^@@ -(\d+),?(\d*) \+(\d+),?(\d*) @@", text, re.M)
if not hunks:
    print("ERROR: no @@ hunks found in diff"); sys.exit(1)
# Count add/remove lines per hunk
lines = text.splitlines()
i = 0
problems = 0
while i < len(lines):
    if lines[i].startswith("@@"):
        adds = removes = 0
        i += 1
        while i < len(lines) and not lines[i].startswith("@@"):
            if lines[i].startswith("+"): adds += 1
            elif lines[i].startswith("-"): removes += 1
            i += 1
        print(f"  hunk ok ({adds}+/{removes}-)")
    else:
        i += 1
print(f"OK: {len(hunks)} hunk(s) parsed cleanly")
PY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-mobile-skin
          path: dist/
